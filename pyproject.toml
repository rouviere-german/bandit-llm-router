[project]
name = "bandit-llm-router"
version = "0.1.0"
description = "Contextual-bandit routing across Claude Haiku, Sonnet and Opus with logged propensities, off-policy evaluation (IPS/SNIPS/DR) and OPE-gated policy activation."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Rouviere German" }]
requires-python = ">=3.12,<3.13"
dependencies = [
    # --- core (every repo) ---
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.9",
    "pydantic-settings>=2.7",
    "structlog>=24.4",
    "opentelemetry-api>=1.27",
    "opentelemetry-sdk>=1.27",
    "prometheus-client>=0.21",
    # --- live provider (offline paths import it lazily) ---
    "anthropic>=1.0,<2",
    # --- ml kit ---
    "numpy>=2.0",
    "pandas>=2.2",
    "pandera[pandas]>=0.24",
    # --- this project ---
    "scipy>=1.14",
    "scikit-learn>=1.5",
    "duckdb>=1.1",
    "mlflow-skinny>=2.20",
]

[project.scripts]
bandit-llm-router = "bandit_llm_router.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "hypothesis>=6.115",
    "httpx>=0.27",
    "ruff>=0.8",
    "mypy>=1.13",
    "pandas-stubs>=2.2",
    "scipy-stubs>=1.14",
    "bandit[toml]>=1.8",
]

[build-system]
requires = ["uv_build>=0.8,<0.13"]
build-backend = "uv_build"

# Baseline metadata consumed by scripts/check_baseline.py.
[tool.portfolio]
kind = "ml"
package = "bandit_llm_router"

# pip-audit has no native config file; tasks.py and CI read this list.
# Every entry needs a justification and a review date.
[tool.portfolio.audit]
ignore_vulns = []

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "scripts", "bench"]

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "B", "UP", "S", "N", "SIM", "C4", "RUF", "PT", "PL", "TRY", "BLE", "DTZ", "T20",
]
ignore = [
    "PLR0913",  # explicit keyword-heavy constructors are fine
    "PLR2004",  # magic numbers in tests and thresholds
    "TRY003",   # messages in exception constructors are fine
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S311", "PLR2004", "PLC0415", "S603"]
"scripts/**" = ["T201"]
"bench/**" = ["T201", "S311", "PLR0915"]
"tasks.py" = ["T201", "S603", "S607"]
"src/bandit_llm_router/cli.py" = ["T201", "PLC0415"]  # lazy imports keep commands fast
"src/bandit_llm_router/demo.py" = ["T201", "PLR0915"]  # a linear, narrated script

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
strict = true
python_version = "3.12"
files = ["src", "tests", "scripts", "bench", "tasks.py"]
plugins = ["pydantic.mypy"]
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["anthropic", "anthropic.*"]
# Imported lazily; type-checked when the SDK is installed (it is, as a project dependency).
follow_imports = "silent"

[[tool.mypy.overrides]]
# scikit-learn and mlflow ship no type information usable under --strict; our wrappers type
# their results at the boundary.
module = ["sklearn", "sklearn.*", "mlflow", "mlflow.*"]
ignore_missing_imports = true
follow_imports = "skip"

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config"]
markers = [
    "unit: fast, isolated tests with no I/O beyond tmp_path",
    "integration: tests that wire several components (app, files, CLI) together",
]
filterwarnings = ["error::DeprecationWarning:bandit_llm_router.*"]

[tool.coverage.run]
source = ["bandit_llm_router"]
branch = true

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = true
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "\\.\\.\\.$",
]

[tool.bandit]
exclude_dirs = ["tests", ".venv"]
skips = []
